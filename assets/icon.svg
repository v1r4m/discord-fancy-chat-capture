<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5865f2"/>
      <stop offset="1" stop-color="#eb459e"/>
    </linearGradient>
  </defs>
  <!-- rounded gradient tile -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <!-- speech-bubble tail (drawn first so the body covers its base) -->
  <path d="M48 82 L40 103 L67 83 Z" fill="#ffffff"/>
  <!-- speech-bubble body -->
  <rect x="22" y="28" width="84" height="56" rx="15" fill="#ffffff"/>
  <!-- two chat lines, in the theme colors -->
  <rect x="38" y="46" width="52" height="8" rx="4" fill="#5865f2"/>
  <rect x="38" y="62" width="36" height="8" rx="4" fill="#eb459e"/>
  <!-- "fancy" sparkle -->
  <path d="M102 14 L106.5 26 L118 30.5 L106.5 35 L102 47 L97.5 35 L86 30.5 L97.5 26 Z" fill="#ffd45a"/>
</svg>
